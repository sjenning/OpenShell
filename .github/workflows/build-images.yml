name: Build Images

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      image-tag:
        required: false
        type: string
        default: ""
      push-images:
        description: Push images to GHCR during the build
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    env:
      COMPONENT: gateway
      BINARY: openshell-gateway
      TARGET_SUFFIX: unknown-linux-gnu
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: &build_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-docker-image
        with:
          component: ${{ env.COMPONENT }}
          binary: ${{ env.BINARY }}
          target-suffix: ${{ env.TARGET_SUFFIX }}
          image-tag: ${{ inputs.image-tag || github.sha }}
          push: ${{ inputs.push-images }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  credential-issuer:
    env:
      COMPONENT: credential-issuer
      BINARY: openshell-credential-issuer
      TARGET_SUFFIX: unknown-linux-gnu
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: *build_steps

  sandbox:
    env:
      COMPONENT: sandbox
      BINARY: openshell-sandbox
      TARGET_SUFFIX: unknown-linux-musl
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: *build_steps

  supervisor:
    env:
      COMPONENT: supervisor
      BINARY: openshell-supervisor
      TARGET_SUFFIX: unknown-linux-gnu
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: *build_steps

  smoke-credential-issuer:
    name: Smoke credential issuer image (${{ matrix.platform }})
    needs: credential-issuer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: linux-amd64-cpu8
          - platform: linux/arm64
            runner: linux-arm64-cpu8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - name: Download candidate image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-credential-issuer
          path: artifacts

      - name: Load and smoke the exact candidate archive
        env:
          PLATFORM: ${{ matrix.platform }}
          CONTAINER_ENGINE: docker
          ISSUER_IMAGE: openshell/credential-issuer:smoke
        run: |
          set -euo pipefail
          # Use the candidate artifact even when no registry push was requested.
          # Select the native platform; never require QEMU or a mutable tag.
          nix shell --inputs-from . nixpkgs#skopeo -c skopeo --insecure-policy copy \
            --override-os linux --override-arch "${PLATFORM#linux/}" \
            oci-archive:artifacts/images/credential-issuer.tar \
            "docker-daemon:${ISSUER_IMAGE}"
          tasks/scripts/smoke-credential-issuer-image.sh
