[package]
name = "openshell-credential-issuer"
description = "Embedded credential references, refresh engine, and built-in token minters for OpenShell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
async-trait = "0.1"
aws-config = { workspace = true }
aws-sdk-sts = { workspace = true }
jsonwebtoken = { workspace = true }
openshell-crypto = { workspace = true }
openshell-core = { path = "../openshell-core" }
openshell-driver-db-credstore = { path = "../openshell-driver-db-credstore" }
openshell-driver-kubernetes-secrets = { path = "../openshell-driver-kubernetes-secrets" }
openshell-driver-vault = { path = "../openshell-driver-vault" }
openshell-extension-core = { path = "../openshell-extension-core" }
prost = { workspace = true }
spiffe = { workspace = true, features = ["x509"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
rcgen = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"

[lints]
workspace = true
