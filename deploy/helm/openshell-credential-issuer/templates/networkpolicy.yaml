{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "issuer.fullname" . }}
  labels:
    {{- include "issuer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "issuer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8443
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
