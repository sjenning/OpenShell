apiVersion: v1
kind: Service
metadata:
  name: {{ include "issuer.fullname" . }}
  labels:
    {{- include "issuer.labels" . | nindent 4 }}
spec:
  # This is a private issuer listener, never a gateway, ingress, or NodePort.
  type: ClusterIP
  ports:
    - name: issuer-mtls
      port: 8443
      targetPort: issuer-mtls
      protocol: TCP
  selector:
    {{- include "issuer.selectorLabels" . | nindent 4 }}
