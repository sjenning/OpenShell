syntax = "proto3";
package openshell.credentials.refresh.v1;

import "credential_store.proto";
import "token_minter.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "options.proto";

// Private gateway-to-issuer protocol. Grants are bound to the authenticated
// gateway identity and its authorized workspaces, never to caller-supplied
// display names. Profile defaults are resolved by the gateway before creation.
service CredentialRefresh {
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse);
  rpc DeleteGrant(DeleteGrantRequest) returns (DeleteGrantResponse);
  rpc RotateGrant(RotateGrantRequest) returns (RotateGrantResponse);
  rpc EnsureFresh(EnsureFreshRequest) returns (EnsureFreshResponse);
  rpc WatchGrants(WatchGrantsRequest) returns (stream WatchGrantsResponse);
}
message ListStrategiesRequest {}
message ListStrategiesResponse {
  repeated openshell.credentials.minter.v1.StrategyDescriptor strategies = 1;
}
message CreateGrantRequest {
  openshell.credentials.store.v1.SecretOwner owner = 1;
  string strategy = 2;
  map<string, string> config = 3 [(openshell.options.v1.secret) = true];
  map<string, string> secret_material = 4 [(openshell.options.v1.secret) = true];
  // Semantic output ID to credential key. Fixed for the grant's lifetime.
  map<string, string> outputs = 5;
  google.protobuf.Duration refresh_before = 6;
  google.protobuf.Duration max_lifetime = 7;
  string idempotency_key = 8;
}
message CreateGrantResponse {
  string grant = 1;
  map<string, string> output_references = 2;
}
message GrantStatus {
  string grant = 1;
  string state = 2;
  google.protobuf.Timestamp expiration_time = 3;
  google.protobuf.Timestamp next_refresh_time = 4;
  string failure_code = 5;
  openshell.credentials.minter.v1.RecoveryAction recovery_action = 6;
  // Advances on each durable observable status change, independent of outputs.
  uint64 version = 7;
}
message GetGrantRequest { string grant = 1; }
message GetGrantResponse { GrantStatus status = 1; }
message DeleteGrantRequest { string grant = 1; string idempotency_key = 2; }
message DeleteGrantResponse {}
// Skip backoff, not uncertain-outcome recovery. Work already admitted continues
// after caller disconnect: cancellation must not lose rotated refresh material.
message RotateGrantRequest { string grant = 1; string idempotency_key = 2; }
message RotateGrantResponse { GrantStatus status = 1; }
message EnsureFreshRequest {
  string grant = 1;
  google.protobuf.Duration min_remaining = 2;
}
// Values are always resolved through CredentialStore, never through this API.
message EnsureFreshResponse { GrantStatus status = 1; }
message WatchGrantsRequest { uint64 after_sequence = 1; }
message WatchGrantsResponse {
  string grant = 1;
  uint64 version = 2;
  uint64 sequence = 3;
  // Same cursor/reset semantics as CredentialStore.WatchSecrets.
  bool reset_required = 4;
  bool deleted = 5;
  // Value-free progress marker with empty grant and zero version.
  bool checkpoint = 6;
}
