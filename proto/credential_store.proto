syntax = "proto3";
package openshell.credentials.store.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "options.proto";

// Private gateway-to-issuer protocol, served by the issuer, not the gateway.
// Every operation requires an authenticated gateway identity. References and
// idempotency keys are namespaced by that identity, independent of supplied
// owner metadata. Workspace access must be checked before reading any value.
service CredentialStore {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ResolveSecrets(ResolveSecretsRequest) returns (ResolveSecretsResponse);
  rpc WatchSecrets(WatchSecretsRequest) returns (stream WatchSecretsResponse);
}

message SecretOwner {
  string workspace = 1;
  string provider_id = 2;
  string credential_key = 3;
  // Audit-only display name, never an authorization key.
  string provider = 4;
}
message GetCapabilitiesRequest {}
message GetCapabilitiesResponse {
  // Protocol major version. This contract is version 1.
  uint32 protocol_version = 1;
  bool supports_watch = 2;
  bool supports_expiration = 3;
  uint32 max_batch_size = 4;
}
message PutSecretRequest {
  SecretOwner owner = 1;
  // Empty creates an immutable new identity; updates preserve owner and epoch.
  string reference = 2;
  string value = 3 [(openshell.options.v1.secret) = true];
  google.protobuf.Timestamp expiration_time = 4;
  optional uint64 expected_version = 5;
  // Required. Same key and payload return the original result, never a new value.
  // Reusing a key with different intent fails ALREADY_EXISTS.
  string idempotency_key = 6;
}
message PutSecretResponse { string reference = 1; uint64 version = 2; }
message DeleteSecretRequest {
  SecretOwner owner = 1;
  string reference = 2;
  optional uint64 expected_version = 3;
  string idempotency_key = 4;
}
message DeleteSecretResponse { uint64 version = 1; }

enum ResolvePurpose {
  RESOLVE_PURPOSE_UNSPECIFIED = 0;
  RESOLVE_PURPOSE_SANDBOX_DELIVERY = 1;
  RESOLVE_PURPOSE_OPERATOR_EXPORT = 2;
  RESOLVE_PURPOSE_REFRESH = 3;
}
message ResolveSecretRequest {
  string request_id = 1;
  SecretOwner owner = 2;
  string reference = 3;
  // Reject changed versions rather than constructing a mixed snapshot.
  optional uint64 expected_version = 4;
}
message ResolveSecretsRequest {
  repeated ResolveSecretRequest secrets = 1;
  ResolvePurpose purpose = 2;
}
message ResolvedSecret {
  string request_id = 1;
  string value = 2 [(openshell.options.v1.secret) = true];
  uint64 version = 3;
  google.protobuf.Timestamp expiration_time = 4;
  // Zero or absent forbids caching. Never exceeds expiration_time.
  google.protobuf.Duration cache_ttl = 5;
}
// All-or-nothing: no partial successes or silently omitted request IDs.
message ResolveSecretsResponse { repeated ResolvedSecret secrets = 1; }
message WatchSecretsRequest {
  // Durable event sequence in the authenticated gateway namespace, not a value
  // version. Zero starts with a reset event requiring full reconciliation.
  uint64 after_sequence = 1;
}
message WatchSecretsResponse {
  string reference = 1;
  uint64 version = 2;
  uint64 sequence = 3;
  // Discard cached values and reconcile all owned references. Also used when a
  // cursor is too old. A consumer must fail closed while watch state is unknown.
  bool reset_required = 4;
  bool revoked = 5;
}
