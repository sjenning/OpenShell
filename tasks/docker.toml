# Docker image build tasks

["build:docker"]
description = "Build all Docker images"
depends = [
  "build:docker:gateway",
  "build:docker:credential-issuer",
  "build:docker:sandbox",
  "build:docker:supervisor",
]
hide = true

["build:docker:ci"]
description = "Build the CI Docker image"
run = "tasks/scripts/docker-build-ci.sh"
hide = true

["build:docker:prebuilt"]
description = "Build and stage Rust binaries consumed by Docker image builds"
run = "tasks/scripts/stage-prebuilt-binaries.sh all"
hide = true

["build:docker:gateway"]
description = "Build the gateway Docker image"
run = "tasks/scripts/docker-build-image.sh gateway"
hide = true

["build:docker:credential-issuer"]
description = "Build the standalone credential issuer image"
run = "tasks/scripts/docker-build-image.sh credential-issuer"
hide = true

["docker:build:credential-issuer"]
description = "Alias for build:docker:credential-issuer"
depends = ["build:docker:credential-issuer"]
hide = true

["docker:smoke:credential-issuer"]
description = "Smoke the issuer image version, rendered configuration, and security boundary"
run = "tasks/scripts/smoke-credential-issuer-image.sh"

["e2e:credential-issuer:images"]
description = "Serially build matching gateway, issuer, runtime, and custom-minter fixture images for two-cluster E2E"
run = "tasks/scripts/build-credential-issuer-e2e-images.sh"

["build:docker:sandbox"]
description = "Build the sandbox runtime image"
run = "tasks/scripts/docker-build-image.sh sandbox"
hide = true

["build:docker:supervisor"]
description = "Build the supervisor image"
run = "tasks/scripts/docker-build-image.sh supervisor"
hide = true

["docker:build:gateway"]
description = "Alias for build:docker:gateway"
depends = ["build:docker:gateway"]
hide = true

["docker:build:sandbox"]
description = "Alias for build:docker:sandbox"
depends = ["build:docker:sandbox"]
hide = true

["docker:build:supervisor"]
description = "Alias for build:docker:supervisor"
depends = ["build:docker:supervisor"]
hide = true

["build:docker:multiarch"]
description = "Build multi-arch gateway, issuer, sandbox, and supervisor images and push to a registry"
run = "tasks/scripts/docker-publish-multiarch.sh"
hide = true

["docker:build:multiarch"]
description = "Alias for build:docker:multiarch"
depends = ["build:docker:multiarch"]
hide = true

["docker:cleanup"]
description = "Remove stale images, volumes, and build cache not used by current deployments"
run = "scripts/docker-cleanup.sh --force"

["docker:cleanup:dry-run"]
description = "Preview what docker:cleanup would remove without deleting anything"
run = "scripts/docker-cleanup.sh --dry-run"
