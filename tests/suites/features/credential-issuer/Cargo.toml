[package]
name = "openshell-test-feature-credential-issuer"
description = "Deployment-level cross-cluster credential issuer and custom minter E2E"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
futures = "0.3"
openshell-core = { path = "../../../../crates/openshell-core" }
openshell-credential-issuer = { path = "../../../../crates/openshell-credential-issuer" }
openshell-extension-core = { path = "../../../../crates/openshell-extension-core" }
openshell-testkit = { path = "../../../testkit/testkit" }
prost-types = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
uuid = { version = "1.10", features = ["v4"] }

[[bin]]
name = "credential-issuer-e2e-fixture"
path = "src/fixture.rs"
